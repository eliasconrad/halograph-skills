<text x="647" y="122" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="14">or a read-only key</text><text x="647" y="146" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="14">about_me · library · browse</text><line x1="881" y1="99" x2="920" y2="99" stroke="#232323" stroke-width="1.5"/><circle cx="881" cy="99" r="3" fill="#fff"><animate attributeName="cx" values="881;920" dur="1.6s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle><rect x="926" y="24" width="250" height="150" rx="20" fill="#0f0f0f" stroke="#232323" stroke-opacity="1"/><text x="948" y="62" fill="#ededed" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="20" font-weight="600">Your agent</text><text x="948" y="98" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="14">knows you on turn one</text><text x="948" y="122" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="14">picks the fastest tool</text><text x="948" y="146" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="14">cites source and date</text></svg>