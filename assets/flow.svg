<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="198" viewBox="0 0 1200 198" role="img" aria-label="Your sources flow into Halograph, served over MCP to your agent"><rect width="1200" height="198" rx="24" fill="#0a0a0a"/><rect x="24" y="24" width="250" height="150" rx="20" fill="#0f0f0f" stroke="#232323" stroke-opacity="1"/><text x="46" y="62" fill="#ededed" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="20" font-weight="600">Your sources</text><text x="46" y="98" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="14">Mail · iMessage · meetings</text><text x="46" y="122" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="14">dictations · notes · calendar</text><text x="46" y="146" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,system-ui,sans-serif" font-size="14">contacts · past sessions</text><line x1="280" y1="99" x2="319" y2="99" stroke="#232323" stroke-width="1.5"/><circle cx="280" cy="99" r="3" fill="#fff"><animate attributeName="cx" values="280;319" dur="1.6s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="325" y="24" width="250" height="150" rx="20" fill="#0f0f0f" stroke="#ededed" stroke-opacity="0.55"/><g transform="translate(346.6666666666667,44) scale(0.0275) translate(-112,-112)" fill="#ededed"><g transform="rotate(0 512 512)"><rect x="362" y="202" width="300" height="140" rx="70" transform="rotate(-30 512 272)"/></g><g transform="rotate(60 512 512)"><rect x="362" y="202" width="300" height="140" rx="70" transform="rotate(-30 512 272)"/></g><g transform="rotate(120 512 512)"><rect x="362" y="202" width="300" height="140" rx="70" transform="rotate(-3