<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="198" viewBox="0 0 1200 198" role="img" aria-label="Your sources flow into Halograph, served over MCP to your agent"><rect width="1200" height="198" rx="24" fill="#0b0d10"/><rect x="24" y="24" width="250" height="150" rx="18" fill="#0d1117" stroke="#30363d"/><text x="46" y="64" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700">Your sources</text><text x="46" y="98" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">Mail · iMessage · meetings</text><text x="46" y="122" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">dictations · notes · calendar</text><text x="46" y="146" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">contacts · past sessions</text><line x1="280" y1="99" x2="319" y2="99" stroke="#30363d" stroke-width="2"/><circle cx="280" cy="99" r="4" fill="#a3b84a"><animate attributeName="cx" values="280;319" dur="1.6s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="325" y="24" width="250" height="150" rx="18" fill="#141a12" stroke="#a3b84a"/><text x="347" y="64" fill="#a3b84a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700">Halograph</text><text x="347" y="98" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">catalog, shelves, search</text><text x="347" y="122" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">read-only or read-write</text><text x="347" y="146" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">data fenced, never commands</text><line x1="581" y1="99" x2="619" y2="99" stroke="#30363d" stroke-width="2"/><circle cx="581" cy="99" r="4" fill="#a3b84a"><animate attributeName="cx" values="581;619" dur="1.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="625" y="24" width="250" height="150" rx="18" fill="#0d1117" stroke="#30363d"/><text x="647" y="64" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700">MCP</text><text x="647" y="98" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">one URL, OAuth</text><text x="647" y="122" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">or a read-only key</text><text x="647" y="146" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">about_me · library · browse</text><line x1="881" y1="99" x2="920" y2="99" stroke="#30363d" stroke-width="2"/><circle cx="881" cy="99" r="4" fill="#a3b84a"><animate attributeName="cx" values="881;920" dur="1.6s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle><rect x="926" y="24" width="250" height="150" rx="18" fill="#0d1117" stroke="#30363d"/><text x="948" y="64" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700">Your agent</text><text x="948" y="98" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">knows you on turn one</text><text x="948" y="122" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetic