<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48" role="img" aria-label="Example questions and the tool the agent picks"><g opacity="0"><text x="64" y="31" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">"What's on this week?"</text><text x="1136" y="31" fill="#a3b84a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" text-anchor="end">→ agenda</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.020;0.180;0.200;1" dur="16.0s" repeatCount="indefinite"/></g><g opacity="0"><text x="64" y="31" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">"Everything on project Atlas"</text><text x="1136" y="31" fill="#a3b84a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" text-anchor="end">→ library → browse topic</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.200;0.220;0.380;0.400;1" dur="16.0s" repeatCount="indefinite"/></g><g opacity="0"><text x="64" y="31" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">"What did Anna write me?"</text><text x="1136" y="31" fill="#a3b84a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" text-anchor="end">→ browse person → read_note</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.400;0.420;0.580;0.600;1" dur="16.0s" repeatCount="indefinite"/></g><g opacity="0"><text x="64" y="31" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">"What did I miss?"</text><text x="1136" y="31" fill="#a3b84a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" text-anchor="end">→ whats_new</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.620;0.780;0.800;1" dur="16.0s" repeatCount="indefinite"/></g><g opacity="0"><text x="64" y="31" fill="#c9d1d9" font-family="ui-monospace,SF